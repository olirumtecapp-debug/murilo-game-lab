name: Atualizar capas realistas do portal

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capas-realistas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Baixar imagens de referência licenciadas para uso gratuito
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/covers
          declare -A photos=(
            [vortex-drive]="Hr5UJNa62-M"
            [bombs-n-roses]="Eg4mops01aM"
            [tornado-classic]="d7ktJCCVl6k"
            [crash-garage]="sh0wBmKuFoQ"
            [skyfall]="obMqNr8tExQ"
          )
          for name in vortex-drive bombs-n-roses tornado-classic crash-garage skyfall; do
            url="https://unsplash.com/photos/${photos[$name]}/download?force=true&w=1200"
            curl -fsSL --retry 3 --retry-delay 2 -A 'Mozilla/5.0' -H 'Accept: image/jpeg' "$url" -o "assets/covers/$name.jpg"
            kind="$(file -b --mime-type "assets/covers/$name.jpg")"
            case "$kind" in image/jpeg|image/png|image/webp) ;; *) echo "Formato inesperado: $name = $kind"; exit 1;; esac
            test "$(stat -c %s "assets/covers/$name.jpg")" -gt 10000
            echo "$name: $(stat -c %s "assets/covers/$name.jpg") bytes ($kind)"
          done
      - name: Substituir ilustrações SVG por fotografias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path=Path('index.html')
          s=path.read_text()
          images=[
            ('Vortex Drive','vortex-drive','Supercélula sobre campos abertos'),
            ("Bombs’n Roses",'bombs-n-roses','Explosão de fogo e fumaça'),
            ('Tornado Simulator','tornado-classic','Tornado real sobre campo aberto'),
            ('Crash Garage','crash-garage','Carro de corrida em pista noturna'),
            ('Skyfall CXIV','skyfall','Avião de carga em voo'),
          ]
          for title,slug,alt in images:
            i=s.find('<h3>'+title+'</h3>')
            if i<0: raise SystemExit('Jogo não encontrado: '+title)
            a=s.rfind('<article class="game"',0,i)
            if a<0: raise SystemExit('Card não encontrado: '+title)
            section=s[a:i]
            section,n=re.subn(r'<svg\b[^>]*>.*?</svg>',f'<img src="assets/covers/{slug}.jpg" alt="{alt}" loading="lazy" decoding="async">',section,count=1,flags=re.S)
            if n!=1: raise SystemExit('Imagem não encontrada: '+title)
            s=s[:a]+section+s[i:]
          s=s.replace('.art svg{width:100%;height:100%;display:block}', '.art svg,.art img{width:100%;height:100%;display:block}.art img{object-fit:cover;object-position:center}')
          path.write_text(s)
          PY
      - name: Publicar capas e portal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/covers/
          git commit -m "Substituir capas ilustradas por fotografias realistas"
          git push origin HEAD:main
